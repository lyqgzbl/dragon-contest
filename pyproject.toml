[project]
name = "dragon-contest"
version = "1.4.6"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2>=2.0.0b10,<3.0.0",
    "nonebot-plugin-alconna>=0.4.3,<1.0.0",
    "nonebot-plugin-orm>=0.6.0,<1.0.0",
    "nonebot-plugin-apscheduler>=0.3.5,<1.0.0",
    "nonebot-plugin-htmlrender<1.0.0",
    "pydantic<3.0.0",
    "sqlalchemy<3.0.0",
    "openai>=1.0.0",
]


[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.26",
]

[tool.uv.build-backend]
source-include = ["src/dragon_contest/migrations/**"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["src/dragon_contest/migrations/**"]

[tool.ruff.lint]
select = [
    "I",
    "E", "W", "F",
    "UP",
    "B",
    "C4", "C90",
    "SIM",
    "PERF",
    "RUF", "RUF100",
    "PT",
    "Q",
]

ignore = ["I001","E402", "B008", "RUF001"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
